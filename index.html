<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f4f7;color:#17212b}
.app{max-width:520px;margin:0 auto;padding:18px 16px 32px}

.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}

select,input{width:100%;height:52px;border:1px solid #ccd3da;border-radius:12px;background:#fff;padding:0 13px;font-size:18px;color:#17212b;margin-bottom:14px}
input{margin-bottom:0}
.results{display:grid;gap:10px}
.result{background:#eef7f0;border-radius:15px;padding:14px 15px}
.result .label{font-size:12px;color:#5c6b63;font-weight:700}
.result .value{font-size:28px;font-weight:800;margin-top:3px}
.result .unit{font-size:13px;color:#65736a}
.note{font-size:13px;color:#687582;text-align:center;margin-top:10px}
.error{color:#a33b32;font-size:13px;margin-top:-4px;margin-bottom:8px;min-height:18px}
</style>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111827">
<script>
if ('serviceWorker' in navigator) {

    <div id="error" class="error"></div>

    <div class="result"><div class="label">TOTAL WEIGHT</div><div id="tons" class="value">—</div><div class="unit">US tons</div></div>
